<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cửa Hàng Đồ Chơi - G4 ToyStore</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght=400;500;600;700&display=swap" rel="stylesheet">
    <!-- Nhúng CSS & JS Header/Navbar chung -->
    <link rel="stylesheet" href="header-navbar.css">
    <script src="header-navbar.js" defer></script>

    <style>
        :root {
            --primary-color: #ff6b6b;
            --secondary-color: #4ecdc4;
            --text-color: #333333;
            --bg-light: #f5f7fa;
            --white: #ffffff;
            --dark-blue: #2c3e50;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Quicksand', sans-serif;
        }

        body {
            background-color: var(--bg-light);
            color: var(--text-color);
            line-height: 1.6;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        /* --- CẤU TRÚC LAYOUT BÊN DƯỚI --- */
        .container {
            max-width: 1300px;
            margin: 30px auto;
            padding: 0 20px;
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 30px;
        }

        /* Sidebar bộ lọc trái */
        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        .sidebar-box {
            background-color: var(--white);
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
        }

        .sidebar-box h3 {
            margin-bottom: 15px;
            color: var(--dark-blue);
            font-size: 1.1rem;
            border-bottom: 2px solid var(--bg-light);
            padding-bottom: 8px;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .filter-link {
            padding: 10px 15px;
            border-radius: 10px;
            font-weight: 500;
            font-size: 0.95rem;
            transition: all 0.2s;
        }

        .filter-link:hover,
        .filter-link.active {
            background-color: var(--secondary-color);
            color: var(--white);
        }

        /* Phần hiển thị sản phẩm bên phải */
        .products-section {
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        .category-title-box {
            background-color: var(--white);
            padding: 25px 30px;
            border-radius: 20px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
        }

        #category-name {
            color: var(--dark-blue);
            font-size: 1.8rem;
        }

        #category-desc {
            color: #777;
            font-size: 0.95rem;
            margin-top: 5px;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
        }

        /* Thẻ sản phẩm */
        .product-card {
            background-color: var(--white);
            border-radius: 20px;
            padding: 25px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.03);
            border: 2px solid transparent;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 370px;
        }

        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            border-color: var(--secondary-color);
        }

        .product-img {
            font-size: 4rem;
            margin-bottom: 12px;
            background: #f8f9fa;
            padding: 20px;
            border-radius: 15px;
        }

        .product-brand-tag {
            display: inline-block;
            font-size: 0.75rem;
            background-color: #e8f8f5;
            color: #117a65;
            padding: 3px 12px;
            border-radius: 50px;
            font-weight: 700;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .product-name {
            font-size: 1.1rem;
            color: #2f3542;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .product-price {
            color: var(--primary-color);
            font-weight: 700;
            font-size: 1.2rem;
        }

        .no-products {
            grid-column: 1 / -1;
            text-align: center;
            padding: 50px;
            background: var(--white);
            border-radius: 20px;
            color: #777;
        }

        .site-footer {
            background-color: var(--dark-blue);
            color: var(--white);
            padding: 30px;
            text-align: center;
            margin-top: 60px;
        }

        /* RESPONSIVE */
        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <aside class="sidebar">
            <div class="sidebar-box">
                <h3>Danh Mục Sản Phẩm</h3>
                <div class="filter-group">
                    <a href="products.html?cat=all" class="filter-link" data-cat="all">Tất cả sản phẩm</a>
                    <a href="products.html?cat=playground-2026" class="filter-link"
                        data-cat="playground-2026">Playground 2026</a>
                    <a href="products.html?cat=qua-to-gia-nho" class="filter-link" data-cat="qua-to-gia-nho">Quà To Giá
                        Nhỏ</a>
                    <a href="products.html?cat=thung-gach-sang-tao" class="filter-link"
                        data-cat="thung-gach-sang-tao">Thùng Gạch Sáng Tạo</a>
                    <a href="products.html?cat=muc-hot" class="filter-link" data-cat="muc-hot">Mục Hot (Bán Chạy)</a>
                </div>
            </div>

            <div class="sidebar-box">
                <h3>Thương Hiệu</h3>
                <div class="filter-group">
                    <a href="products.html?brand=lego" class="filter-link" data-brand="lego">LEGO</a>
                    <a href="products.html?brand=hotwheels" class="filter-link" data-brand="hotwheels">Hot Wheels</a>
                    <a href="products.html?brand=mylittlepony" class="filter-link" data-brand="mylittlepony">My Little
                        Pony</a>
                    <a href="products.html?brand=bandai" class="filter-link" data-brand="bandai">Bandai</a>
                </div>
            </div>
        </aside>

        <section class="products-section">
            <div class="category-title-box">
                <h2 id="category-name">Đang phân tích...</h2>
                <p id="category-desc">Danh sách đồ chơi tương ứng</p>
            </div>

            <div class="products-grid" id="products-render">
            </div>
        </section>
    </div>

    <footer class="site-footer">
        <p>&copy; 2026 G4 ToyStore - Hệ thống View tổng hợp đa năng</p>
    </footer>

    <script src="../../assets/js/shared/config.js"></script>
    <script src="../../assets/js/shared/storage.js"></script>
    <script src="../../assets/js/shared/api_client.js"></script>
    <script src="../../assets/js/shared/product_api.js"></script>

    <script>
        // Từ điển cấu hình Tiêu đề / Mô tả hiển thị (sẽ được thay thế bởi API Categories)
        const infoConfig = {
            'all': { title: 'Tất Cả Sản Phẩm', desc: 'Duyệt xem toàn bộ các sản phẩm có tại cửa hàng.' },
            'lego': { title: 'Thương Hiệu: LEGO', desc: 'Thế giới lắp ráp sáng tạo đỉnh cao từ Đan Mạch.' },
            'hotwheels': { title: 'Thương Hiệu: HOT WHEELS', desc: 'Những mô hình quái xế đường đua bốc lửa.' },
            'mylittlepony': { title: 'Thương Hiệu: MY LITTLE PONY', desc: 'Những chú ngựa sắc màu bước ra từ câu chuyện cổ tích.' },
            'bandai': { title: 'Thương Hiệu: BANDAI', desc: 'Mô hình nhân vật và đồ chơi công nghệ cao Nhật Bản.' }
        };

        // Cache category data to display names
        let categoryMap = {};

        async function initPage() {
            try {
                // Fetch Categories
                const catRes = await apiRequest("/categories");
                if (catRes && catRes.data) {
                    catRes.data.forEach(c => {
                        categoryMap[c.id] = c.name;
                        infoConfig[c.id] = { title: c.name, desc: c.description };
                    });
                }
            } catch (err) {
                console.error("Failed to load categories", err);
            }

            try {
                // Fetch Products
                const res = await fetchProducts();
                let productList = res.data || [];

                const urlParams = new URLSearchParams(window.location.search);
                const catParam = urlParams.get('cat');
                const brandParam = urlParams.get('brand');

                let renderList = [];
                let currentKey = 'all';

                // Xoá tất cả class active cũ ở Sidebar
                document.querySelectorAll('.filter-link').forEach(el => el.classList.remove('active'));

                // Trường hợp 1: Lọc theo Thương hiệu (?brand=...) - Backend có thể dùng brand_id
                if (brandParam) {
                    currentKey = brandParam;
                    // Lọc tạm bằng ID (nếu brandParam là ID) hoặc name (nếu frontend vẫn dùng text)
                    // Hiện tại mockup dùng text ('lego', 'bandai'), nhưng backend lưu brand_id integer.
                    // Tạm thời hiển thị tất cả nếu chưa map được brand_id
                    renderList = productList; 
                    const activeEl = document.querySelector(`.filter-link[data-brand="${brandParam}"]`);
                    if (activeEl) activeEl.classList.add('active');
                }
                // Trường hợp 2: Lọc theo Danh mục (?cat=...)
                else {
                    if (catParam && catParam !== 'all') {
                        // catParam có thể là ID (vd: 1, 2, 3) hoặc slug cũ ('playground-2026').
                        // Chúng ta sẽ giả định url filter mới sử dụng ID.
                        currentKey = catParam;
                        renderList = productList.filter(item => item.category_id == catParam);
                    } else {
                        currentKey = 'all';
                        renderList = productList;
                    }

                    const activeEl = document.querySelector(`.filter-link[data-cat="${currentKey}"]`);
                    if (activeEl) activeEl.classList.add('active');
                }

                // Ghi nội dung tiêu đề danh mục lên View
                if (infoConfig[currentKey]) {
                    document.getElementById('category-name').innerText = infoConfig[currentKey].title;
                    document.getElementById('category-desc').innerText = infoConfig[currentKey].desc;
                } else {
                    document.getElementById('category-name').innerText = "Sản phẩm";
                    document.getElementById('category-desc').innerText = "";
                }

                // Thực hiện đổ dữ liệu vào Grid html
                const grid = document.getElementById('products-render');
                grid.innerHTML = '';

                if (renderList.length === 0) {
                    grid.innerHTML = `<div class="no-products"><h3>Hiện chưa có mặt hàng nào thuộc nhóm này!</h3></div>`;
                    return;
                }

                renderList.forEach(item => {
                    const priceFormatted = new Intl.NumberFormat('vi-VN', { style: 'currency', currency: 'VND' }).format(item.price);
                    // Dùng emoji làm placeholder hình ảnh
                    let img = '🎁';
                    if (item.name.toLowerCase().includes('xe')) img = '🏎️';
                    if (item.name.toLowerCase().includes('gấu')) img = '🧸';
                    
                    grid.innerHTML += `
                        <a href="product-detail.html?id=${item.id}" class="product-card">
                            <div class="product-img">${img}</div>
                            <div>
                                <span class="product-brand-tag">Brand ${item.brand_id || 'Other'}</span>
                                <h4 class="product-name">${item.name}</h4>
                                <p class="product-price">${priceFormatted}</p>
                            </div>
                        </a>
                    `;
                });
            } catch (error) {
                console.error("Error loading products:", error);
                document.getElementById('products-render').innerHTML = `<div class="no-products"><h3>Lỗi tải dữ liệu sản phẩm!</h3></div>`;
            }
        }

        // Đăng ký sự kiện an toàn khi DOM sẵn sàng
        window.addEventListener("DOMContentLoaded", () => {
            initPage();
        });
    </script>
</body>

</html>
