<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập - G4 ToyStore</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Google Identity Services SDK -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Quicksand', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-container {
            background-color: #ffffff;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .logo-area {
            margin-bottom: 25px;
        }

        .logo-area h1 {
            color: #ff6b6b;
            font-size: 2rem;
            font-weight: 700;
        }

        .logo-area p {
            color: #777;
            font-size: 0.9rem;
            margin-top: 5px;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .form-group input[type="email"],
        .form-group input[type="password"] {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            outline: none;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .form-group input:focus {
            border-color: #4ecdc4;
            box-shadow: 0 0 8px rgba(78, 205, 196, 0.2);
        }

        .options-area {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            font-size: 0.85rem;
        }

        .options-area a {
            color: #ff6b6b;
            text-decoration: none;
            font-weight: 600;
        }

        .options-area a:hover {
            text-decoration: underline;
        }

        .btn-login {
            width: 100%;
            padding: 13px;
            background-color: #ff6b6b;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.3s ease, transform 0.1s ease;
        }

        .btn-login:hover {
            background-color: #ee5253;
        }

        .btn-login:active {
            transform: scale(0.98);
        }

        .btn-login:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }

        /* Đường gạch ngang phân cách */
        .social-divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 25px 0;
            color: #aaa;
            font-size: 0.85rem;
        }

        .social-divider::before,
        .social-divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px dashed #e0e0e0;
        }

        .social-divider:not(:empty)::before {
            margin-right: .5em;
        }

        .social-divider:not(:empty)::after {
            margin-left: .5em;
        }

        /* Vùng chứa nút Google chính thức */
        .social-login-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* Wrapper căn giữa nút Google do SDK render */
        .google-btn-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 44px;
        }

        /* Đảm bảo nút Google trải full width */
        .google-btn-wrapper>div {
            width: 100% !important;
        }

        .google-btn-wrapper iframe {
            width: 100% !important;
        }

        .register-link {
            margin-top: 25px;
            font-size: 0.9rem;
            color: #666;
        }

        .register-link a {
            color: #4ecdc4;
            text-decoration: none;
            font-weight: 700;
        }

        .register-link a:hover {
            text-decoration: underline;
        }

        /* Thông báo lỗi / thành công */
        .alert {
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 0.88rem;
            font-weight: 600;
            margin-bottom: 18px;
            display: none;
            text-align: left;
        }

        .alert-error {
            background-color: #fff0f0;
            border: 1px solid #ffcccc;
            color: #cc0000;
        }

        .alert-success {
            background-color: #f0fff4;
            border: 1px solid #b2f5c8;
            color: #1a7a3e;
        }
    </style>
</head>

<body>

    <div class="login-container">
        <div class="logo-area">
            <h1>🧸 G4 ToyStore</h1>
            <p>Đăng nhập hệ thống cửa hàng</p>
        </div>

        <!-- Thông báo -->
        <div id="alertBox" class="alert"></div>

        <form id="loginForm" novalidate>
            <!-- Email -->
            <div class="form-group">
                <label for="email">Email đăng nhập</label>
                <input type="email" id="email" name="HKKM_Email" placeholder="Nhập tài khoản email..." required>
            </div>

            <!-- Mật khẩu -->
            <div class="form-group">
                <label for="password">Mật khẩu</label>
                <input type="password" id="password" name="HKKM_Password_Hash" placeholder="Nhập mật khẩu của bạn..."
                    required>
            </div>

            <div class="options-area">
                <label style="display: flex; align-items: center; gap: 5px; cursor: pointer;">
                    <input type="checkbox" name="remember"> Ghi nhớ đăng nhập
                </label>
                <a href="#">Quên mật khẩu?</a>
            </div>

            <button type="submit" id="btnLogin" class="btn-login">ĐĂNG NHẬP</button>
        </form>

        <!-- Phân cách -->
        <div class="social-divider">Hoặc đăng nhập bằng</div>

        <div class="social-login-group">
            <!-- Google renderButton sẽ tạo nút chính thức vào div này -->
            <div class="google-btn-wrapper">
                <div id="googleSignInDiv"></div>
            </div>
        </div>

        <div class="register-link">
            Thành viên mới? <a href="register.html">Đăng ký tài khoản</a>
        </div>
    </div>

    <script>
        // =============================================
        //  CẤU HÌNH - thay YOUR_GOOGLE_CLIENT_ID.apps.googleusercontent.com
        //  bằng Client ID thực của bạn từ Google Cloud Console
        // =============================================
        const GOOGLE_CLIENT_ID = "641040374252-ju1ql1lrefn7cgjcl58obhkqol6rhsnc.apps.googleusercontent.com";
        const API_BASE = "http://127.0.0.1:5000/api";

        // =============================================
        //  Tiện ích hiển thị thông báo
        // =============================================
        function showAlert(message, type = "error") {
            const box = document.getElementById("alertBox");
            box.textContent = message;
            box.className = `alert alert-${type}`;
            box.style.display = "block";
        }

        function hideAlert() {
            const box = document.getElementById("alertBox");
            box.style.display = "none";
        }

        // =============================================
        //  Lưu token và chuyển hướng sau khi đăng nhập thành công
        // =============================================
        function handleLoginSuccess(data) {
            // Lưu tokens vào localStorage
            localStorage.setItem("access_token", data.access_token);
            localStorage.setItem("refresh_token", data.refresh_token);
            localStorage.setItem("user", JSON.stringify(data.user));

            showAlert(`Chào mừng ${data.user.full_name}! Đang chuyển hướng...`, "success");

            // Chuyển hướng sau 1.2 giây
            setTimeout(() => {
                if (data.user.role === "ADMIN") {
                    window.location.href = "../admin/dashboard.html";
                } else {
                    window.location.href = "home.html";
                }
            }, 1200);
        }

        // =============================================
        //  ĐĂNG NHẬP THƯỜNG (Email + Password)
        // =============================================
        document.getElementById("loginForm").addEventListener("submit", async function (e) {
            e.preventDefault();
            hideAlert();

            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;
            const btn = document.getElementById("btnLogin");

            if (!email || !password) {
                showAlert("Vui lòng nhập đầy đủ email và mật khẩu.");
                return;
            }

            btn.disabled = true;
            btn.textContent = "Đang đăng nhập...";

            try {
                const res = await fetch(`${API_BASE}/auth/login`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email, password })
                });

                const data = await res.json();

                if (res.ok) {
                    handleLoginSuccess(data);
                } else {
                    showAlert(data.message || "Email hoặc mật khẩu không đúng.");
                }
            } catch (err) {
                showAlert("Không thể kết nối đến máy chủ. Vui lòng thử lại.");
            } finally {
                btn.disabled = false;
                btn.textContent = "ĐĂNG NHẬP";
            }
        });

        // =============================================
        //  ĐĂNG NHẬP GOOGLE
        // =============================================

        // Callback được Google SDK gọi sau khi người dùng chọn tài khoản Google
        async function handleGoogleCredential(response) {
            hideAlert();

            try {
                const res = await fetch(`${API_BASE}/auth/google`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ token: response.credential })
                });

                const data = await res.json();

                if (res.ok) {
                    handleLoginSuccess(data);
                } else {
                    showAlert(data.message || "Đăng nhập Google thất bại.");
                }
            } catch (err) {
                showAlert("Không thể kết nối đến máy chủ. Vui lòng thử lại.");
            }
        }

        // Khởi tạo Google Identity Services và render nút chính thức
        // SDK tải async nên dùng interval để chờ sẵn sàng
        function initGoogleSignIn() {
            if (typeof google !== "undefined" && google.accounts && google.accounts.id) {
                google.accounts.id.initialize({
                    client_id: GOOGLE_CLIENT_ID,
                    callback: handleGoogleCredential
                    // Không dùng ux_mode để tránh lỗi origin_mismatch
                });

                // renderButton tạo nút Google chính thức — không cần origin riêng
                google.accounts.id.renderButton(
                    document.getElementById("googleSignInDiv"),
                    {
                        theme: "outline",      // "outline" | "filled_blue" | "filled_black"
                        size: "large",
                        width: 320,            // px — khớp chiều rộng container
                        text: "continue_with", // "signin_with" | "signup_with" | "continue_with"
                        locale: "vi"           // Hiển thị tiếng Việt
                    }
                );
            } else {
                // SDK chưa tải xong, thử lại sau 100ms
                setTimeout(initGoogleSignIn, 100);
            }
        }

        // Bắt đầu chờ SDK
        initGoogleSignIn();
    </script>

</body>

</html>
